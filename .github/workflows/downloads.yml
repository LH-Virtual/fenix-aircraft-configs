name: Downloads

# On every push: generates the tables (README.md per fleet), builds one zip
# per fleet and attaches it to the release "latest".
# Fixed link per fleet: /releases/latest/download/<FLEET>.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads
  cancel-in-progress: true

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate tables
        run: |
          python3 tools/tabellen.py
          git add -A -- '*/README.md'
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update tables"
            git push
          fi

      - name: Build zips
        run: |
          mkdir dist
          for d in VL319 LH319 LH320 4Y320 LH321; do
            if compgen -G "$d/*/livery.cfg" > /dev/null; then
              (cd "$d" && zip -qr "../dist/$d.zip" . -x .gitkeep -x README.md)
            fi
          done
          ls -l dist

      - name: Update release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          notes="As of $(date -u +%F), commit $(git rev-parse --short HEAD). One zip per fleet with one folder per registration."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --title "Current configs" --notes "$notes"
          else
            gh release create latest --title "Current configs" --notes "$notes" --latest
          fi
          gh release upload latest dist/*.zip --clobber
