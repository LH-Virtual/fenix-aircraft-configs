name: Downloads

# Erzeugt bei jedem Push die Tabellen (README.md je Flotte), packt pro Flotte
# ein Zip und legt es am Release "latest" ab.
# Fester Link je Flotte: /releases/latest/download/<FLOTTE>.zip

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads
  cancel-in-progress: true

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tabellen erzeugen
        run: |
          python3 tools/tabellen.py
          git add -A -- '*/README.md'
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Tabellen aktualisiert"
            git push
          fi

      - name: Zips bauen
        run: |
          mkdir dist
          for d in VL319 LH319 LH320 4Y320 LH321; do
            if compgen -G "$d/*/livery.cfg" > /dev/null; then
              (cd "$d" && zip -qr "../dist/$d.zip" . -x .gitkeep -x README.md)
            fi
          done
          ls -l dist

      - name: Release "latest" aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          notes="Stand $(date -u +%F), Commit $(git rev-parse --short HEAD). Je Flotte ein Zip mit einem Ordner pro Kennzeichen."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --notes "$notes"
          else
            gh release create latest --title "Aktuelle Konfigurationen" --notes "$notes" --latest
          fi
          gh release upload latest dist/*.zip --clobber
